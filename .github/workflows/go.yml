name: Go

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '**.go'
      - '**.h'
      - '**.mod'
      - '**.s'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.go'
      - '**.h'
      - '**.mod'
      - '**.s'

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.config.name }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - ubuntu-24.04-arm
        config:
        # "No AVX-512" disables that dispatch path at compile time while retaining
        # runtime AVX2 detection. The expectations confirm both decisions.
        - { name: "Standard",   tags: "",                     flags: "-race", expect512: "",  expect2: "",  expectSHA3: "",  godebug: "" }
        - { name: "Pure Go",    tags: "purego",               flags: "",      expect512: "",  expect2: "",  expectSHA3: "",  godebug: "" }
        - { name: "No AVX-512", tags: "kt128_disable_avx512", flags: "-race", expect512: "0", expect2: "1", expectSHA3: "",  godebug: "" }
        - { name: "No SHA3",    tags: "",                     flags: "-race", expect512: "",  expect2: "",  expectSHA3: "0", godebug: "cpu.sha3=off" }
        exclude:
          # Run the architecture-specific forced fallbacks only where relevant.
          - os: ubuntu-24.04-arm
            config: { name: "Pure Go",    tags: "purego",               flags: "",      expect512: "",  expect2: "",  expectSHA3: "",  godebug: "" }
          - os: ubuntu-24.04-arm
            config: { name: "No AVX-512", tags: "kt128_disable_avx512", flags: "-race", expect512: "0", expect2: "1", expectSHA3: "",  godebug: "" }
          - os: ubuntu-24.04
            config: { name: "No SHA3",    tags: "",                     flags: "-race", expect512: "",  expect2: "",  expectSHA3: "0", godebug: "cpu.sha3=off" }
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        cache: true

    - name: Build
      run: go build -tags "${{ matrix.config.tags }}" ./...

    - name: Test
      env:
        KT128_EXPECT_AVX512: ${{ matrix.config.expect512 }}
        KT128_EXPECT_AVX2: ${{ matrix.config.expect2 }}
        KT128_EXPECT_SHA3: ${{ matrix.config.expectSHA3 }}
        GODEBUG: ${{ matrix.config.godebug }}
      run: go test ${{ matrix.config.flags }} -tags "${{ matrix.config.tags }}" ./...

  sde:
    name: SDE (${{ matrix.target.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
        # Exercise AVX-512, AVX2+BMI2, and pre-BMI2 generic dispatch regardless
        # of the GitHub runner's actual CPU.
        - { name: "AVX-512 (spr)", chip: "spr", expect512: "1", expect2: "1", expectBMI2: "1" }
        - { name: "AVX2 (hsw)",    chip: "hsw", expect512: "0", expect2: "1", expectBMI2: "1" }
        - { name: "Generic (snb)", chip: "snb", expect512: "0", expect2: "0", expectBMI2: "0" }
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        cache: true

    - name: Setup SDE
      uses: petarpetrovt/setup-sde@v5.0
      with:
        environmentVariableName: SDE_PATH
        sdeVersion: "10.8.0"

    # Compile natively, then emulate only the test binary so SDE never has to run
    # the Go toolchain.
    - name: Build test binary
      run: go test -c -o kt128.test .

    - name: Test under SDE
      env:
        KT128_EXPECT_AVX512: ${{ matrix.target.expect512 }}
        KT128_EXPECT_AVX2: ${{ matrix.target.expect2 }}
        KT128_EXPECT_BMI2: ${{ matrix.target.expectBMI2 }}
      run: $SDE_PATH/sde64 -${{ matrix.target.chip }} -- ./kt128.test -test.v -test.timeout 20m

  bigendian:
    name: Big-endian (s390x)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        cache: true

    # Register binfmt handlers so the kernel runs s390x binaries through QEMU.
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3

    # s390x is big-endian, so this exercises the pure-Go path's LittleEndian byte
    # handling on a big-endian host; the asm targets are build-excluded there.
    - name: Test
      env:
        GOARCH: s390x
      run: go test ./...

  build:
    name: Build (${{ matrix.target.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
        # 386 is the only 32-bit dimension (int is 32-bit); wasm is a distinct
        # platform. Other ports compile the same pure-Go files as the test jobs,
        # and endianness does not affect compilation, so they add no coverage.
        - { name: "linux/386",   goos: linux,  goarch: "386" }
        - { name: "wasip1/wasm", goos: wasip1, goarch: wasm }
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        cache: true

    - name: Build
      env:
        GOOS: ${{ matrix.target.goos }}
        GOARCH: ${{ matrix.target.goarch }}
      run: go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        cache: false

    - name: go fmt
      run: go fmt ./... && git diff --exit-code

    - name: go vet
      run: go vet ./...

    - name: go fix
      run: go fix ./... && git diff --exit-code

    - name: go mod tidy
      run: go mod tidy && git diff --exit-code

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        cache: true

    # This mainly catches standard-library, toolchain, and x/sys vulnerabilities.
    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
