name: Fuzz

on:
  workflow_dispatch:
    inputs:
      fuzziterations:
        description: 'How many fuzz inputs to execute per target.'
        type: number
        default: 10000
  schedule:
    # Nightly at 04:17 UTC. Fuzzing is too slow to gate pushes and PRs; the seed
    # corpus still runs there as part of the normal test suite.
    - cron: '17 4 * * *'

permissions:
  contents: read

# Duration deadlines can race with fuzz-worker shutdown (Go issue 75804).
# A fixed execution count keeps nightly termination deterministic.
env:
  FUZZITERATIONS: ${{ github.event.inputs.fuzziterations || '10000' }}

jobs:
  fuzz:
    name: Fuzz (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        # Arch-independent and native-assembly targets, on both architectures
        # (arm64 included because it is the primary development host).
        - { name: "XOF (amd64)",       os: ubuntu-24.04,     target: FuzzXOF,                 chip: "" }
        - { name: "Lifecycle (amd64)", os: ubuntu-24.04,     target: FuzzXOFLifecycle,        chip: "" }
        - { name: "P1600 (amd64)",     os: ubuntu-24.04,     target: FuzzP1600,               chip: "" }
        - { name: "Absorb (amd64)",    os: ubuntu-24.04,     target: FuzzFastLoopAbsorb168x1, chip: "" }
        - { name: "XOF (arm64)",       os: ubuntu-24.04-arm, target: FuzzXOF,                 chip: "" }
        - { name: "Lifecycle (arm64)", os: ubuntu-24.04-arm, target: FuzzXOFLifecycle,        chip: "" }
        - { name: "P1600 (arm64)",     os: ubuntu-24.04-arm, target: FuzzP1600,               chip: "" }
        - { name: "Absorb (arm64)",    os: ubuntu-24.04-arm, target: FuzzFastLoopAbsorb168x1, chip: "" }
        # Exercise the AVX-512 paths under SDE with the single-process stress
        # driver. Go's fuzz coordinator forks worker subprocesses, which is not
        # reliable under Pin.
        - { name: "XOF (spr)",       os: ubuntu-24.04,     target: FuzzXOF,                       chip: spr }
        - { name: "Lifecycle (spr)", os: ubuntu-24.04,     target: FuzzXOFLifecycle,              chip: spr }
        - { name: "P1600 (spr)",     os: ubuntu-24.04,     target: FuzzP1600AVX512,               chip: spr }
        - { name: "Absorb (spr)",    os: ubuntu-24.04,     target: FuzzFastLoopAbsorb168x1AVX512, chip: spr }
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
        cache: false

    # Persist the generated corpus across runs (keyed per target/arch) so nightly
    # fuzzing accumulates coverage instead of restarting from the seeds each time.
    - name: Restore fuzz corpus
      if: matrix.chip == ''
      uses: actions/cache@v6
      with:
        path: ~/.cache/go-build/fuzz
        key: fuzz-${{ matrix.target }}-${{ matrix.os }}-${{ matrix.chip }}-${{ github.run_id }}
        restore-keys: |
          fuzz-${{ matrix.target }}-${{ matrix.os }}-${{ matrix.chip }}-

    - name: Setup SDE
      if: matrix.chip != ''
      uses: petarpetrovt/setup-sde@31aa4a8e85e109bef00f1d838613fcc6ec421271
      with:
        environmentVariableName: SDE_PATH
        sdeVersion: "10.8.0"

    - name: Fuzz
      if: matrix.chip == ''
      run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime "${FUZZITERATIONS}x" .

    # Compile natively, then run deterministic fuzz-equivalent checks in one
    # process under SDE. This keeps Pin away from Go's fuzz-worker fork path.
    - name: Stress under SDE
      if: matrix.chip != ''
      env:
        # All SDE fuzz targets emulate an AVX-512 CPU.
        KT128_EXPECT_AVX512: "1"
        KT128_EXPECT_AVX2: "1"
        KT128_EXPECT_BMI2: "1"
        KT128_STRESS_TARGET: ${{ matrix.target }}
        KT128_STRESS_ITERATIONS: ${{ env.FUZZITERATIONS }}
        KT128_STRESS_SEED: ${{ github.run_id }}
      run: |
        go test -c -o kt128.test .
        # Preflight: fail loudly if SDE did not actually enable AVX-512. Otherwise
        # the AVX-512 fuzzers would silently skip (and FuzzXOF would fuzz the
        # AVX2 path), and "no fuzz tests to fuzz" exits 0 — a green run that tested
        # nothing.
        timeout --kill-after=30s 2m "$SDE_PATH/sde64" -${{ matrix.chip }} -- \
          ./kt128.test -test.run '^TestExpectedISA$' -test.v
        echo "SDE stress target=$KT128_STRESS_TARGET seed=$KT128_STRESS_SEED iterations=$KT128_STRESS_ITERATIONS"
        # Bound SDE itself in case Pin hangs while shutting down after Go exits.
        timeout --kill-after=30s 25m "$SDE_PATH/sde64" -${{ matrix.chip }} -- ./kt128.test \
          -test.run '^TestSDEStress$' -test.timeout 20m

    # On a crash, go test writes the reproducer to testdata/fuzz/<Target>/; keep
    # it so the failing input can be replayed locally.
    - name: Upload failing inputs
      if: failure() && matrix.chip == ''
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-failure-${{ matrix.target }}-${{ matrix.os }}-${{ matrix.chip }}
        path: testdata/fuzz
        if-no-files-found: ignore
